<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EIMEI 現場見積</title>
<meta name="theme-color" content="#FE934C">
<meta name="description" content="EIMEI 現場見積 — カタログ検索と見積作成">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EIMEI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--ink:#2E1B0E;--ink2:#6B5443;--mute:#8E7A66;--paper:#fff;--wash:#FDF5EE;
--line:#F0DFCE;--brand:#FE934C;--on-brand:#2E1B0E;--brand-d:#FE934C;--brand-lite:#FDB07A;--brand-tx:#B84E12;--brand-w:#FFF1E5;--accent2:#2A5470;--accent2-w:#EAF0F5;--ok:#1B6B4C;--ng:#B2352C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior-y:none}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
color:var(--ink);background:var(--wash);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#app{max-width:540px;margin:0 auto;background:var(--paper);min-height:100vh;position:relative;box-shadow:0 0 0 1px var(--line)}
header{background:var(--brand-d);color:var(--on-brand);padding:12px 16px 0;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
.brand b{font-size:16px;letter-spacing:.14em}
.brand span{font-size:11px;color:#5E3413}
.tabs{display:flex}
.tabs button{flex:1;background:none;border:none;border-bottom:3px solid transparent;color:#5E3413;
font-family:inherit;font-size:14px;padding:9px 0 8px;cursor:pointer;font-weight:500}
.tabs button[aria-selected=true]{color:var(--on-brand);border-bottom-color:var(--on-brand);font-weight:700}
.badge{display:inline-block;background:#8A3F0C;color:#FFE6D2;font-size:11px;border-radius:9px;padding:0 6px;margin-left:4px;font-weight:700}
main{padding:16px 16px 130px}
.crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mute);margin-bottom:14px;flex-wrap:wrap}
.crumb button{background:none;border:none;color:var(--brand-tx);font-family:inherit;font-size:13px;
padding:0;cursor:pointer;font-weight:500}
h2{font-size:18px;font-weight:700;margin:0 0 3px}
.lead{font-size:13px;color:var(--mute);margin:0 0 16px}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;
border:1px solid var(--line);border-radius:10px;padding:15px 16px;margin-bottom:9px;
font-family:inherit;cursor:pointer;color:var(--ink)}
.tile:disabled{opacity:.45;cursor:default}
.tile .t1{flex:1}
.tile .t1 b{display:block;font-size:16px;font-weight:700}
.tile .t1 span{font-size:12px;color:var(--mute)}
.tile .cn{font-size:13px;color:var(--mute);white-space:nowrap}
.tile .ar{color:var(--line);font-size:20px;line-height:1}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 14px 15px;
font-family:inherit;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;
align-items:center;justify-content:flex-end;gap:12px;min-height:132px}
.mk:active{border-color:var(--brand-lite);background:var(--brand-w)}
.mk:disabled{cursor:default;background:var(--wash);border-style:dashed}
.mk:disabled .lg img{opacity:.42}
.mk .lg{height:44px;display:flex;align-items:center;justify-content:center;width:100%}
.mk .lg img{max-height:44px;max-width:100%;object-fit:contain}
.mk .wm{font-size:19px;font-weight:700;letter-spacing:.1em;color:var(--ink)}
.mk:disabled .wm{color:var(--mute);font-weight:500}
.mk .ft{text-align:center;line-height:1.45}
.mk .ft b{display:block;font-size:13px;font-weight:700}
.mk .ft span{font-size:11px;color:var(--mute)}
.srch{position:relative;margin-bottom:12px}
.srch input{width:100%;padding:11px 13px 11px 38px;border:1px solid var(--line);border-radius:8px;
font-size:16px;font-family:inherit;background:var(--wash)}
.srch input:focus{outline:2px solid #E07A32;outline-offset:-1px;background:#fff}
.srch svg{position:absolute;left:12px;top:13px;width:16px;height:16px;fill:none;stroke:var(--mute);stroke-width:2}
.cnt{font-size:12px;color:var(--mute);margin:0 0 8px}
.hit{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line)}
.hit .l{flex:1;min-width:0}
.hit .cd{font-size:15px;font-weight:700;letter-spacing:.02em}
.hit .nm{font-size:13px;color:var(--ink2);margin-top:1px}
.hit .mt{font-size:11px;color:var(--mute);margin-top:2px}
.hit .r{text-align:right;white-space:nowrap}
.hit .pv{font-size:16px;font-weight:700}
.hit .lp{font-size:11px;color:var(--mute);text-decoration:line-through}
.hit mark{background:#FFE7A8;padding:0 1px;border-radius:2px}
.add{border:1px solid #E9A472;color:var(--brand-tx);background:#fff;border-radius:6px;
padding:6px 11px;font-size:12px;font-family:inherit;font-weight:700;cursor:pointer;margin-top:6px}
.add.in{background:var(--brand);color:var(--on-brand);border-color:#E07A32}
.empty{color:var(--mute);font-size:14px;padding:34px 8px;text-align:center;line-height:1.8}
.cat{font-size:11px;color:var(--mute);letter-spacing:.1em;margin:20px 0 0;font-weight:700}
.cat:first-of-type{margin-top:0}
.line{display:flex;align-items:center;gap:11px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.line .bx{width:21px;height:21px;border:1.5px solid var(--line);border-radius:5px;flex:0 0 auto;
display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.line[aria-selected=true] .bx{background:var(--brand);border-color:#E07A32;color:var(--on-brand)}
.line .n{flex:1;font-size:14.5px}
.line .h{font-size:11px;color:var(--mute);display:block}
.line .p{font-size:14px;font-weight:500}
.card{border:1px solid var(--line);border-radius:10px;padding:16px;background:#fff}
table.q{width:100%;border-collapse:collapse;font-size:14px}
table.q td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.q td.r{text-align:right;white-space:nowrap;padding-left:10px}
table.q td small{display:block;font-size:11px;color:var(--mute)}
table.q tr.tot td{border-bottom:none;border-top:2px solid var(--ink);padding-top:12px;font-weight:700;font-size:17px}
.dochead{border-bottom:2px solid var(--brand-lite);padding-bottom:10px;margin-bottom:12px}
.dochead b{font-size:16px;letter-spacing:.06em}
.dochead div{font-size:12px;color:var(--mute);margin-top:3px}
.promise{background:var(--brand-w);border-radius:8px;padding:12px 14px;margin-top:14px;font-size:12.5px;line-height:1.75}
.promise b{display:block;margin-bottom:4px;color:var(--brand-tx)}
.intern{background:var(--accent2-w);border-left:4px solid var(--accent2);padding:14px;border-radius:0 8px 8px 0}
.intern .k{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
.big{font-size:25px;font-weight:700}
.verdict{margin-top:10px;padding:10px 12px;border-radius:6px;font-size:13px;font-weight:500;line-height:1.6}
.verdict.y{background:#E3F2EA;color:var(--ok)}.verdict.n{background:#FBE9E7;color:var(--ng)}
.rm{background:none;border:none;color:var(--ng);font-size:12px;font-family:inherit;cursor:pointer}
footer{position:fixed;bottom:0;left:0;right:0;max-width:540px;margin:0 auto;background:rgba(255,255,255,.97);
border-top:1px solid var(--line);padding:11px 16px calc(11px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
footer .sum{flex:1;font-size:11.5px;color:var(--mute);line-height:1.3}
footer .sum b{display:block;font-size:19px;color:var(--ink);font-weight:700}
button.go{background:var(--brand);color:var(--on-brand);border:none;padding:12px 20px;border-radius:7px;
font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
button.go:disabled{background:#EBDCCC;color:#9C8873}
button.ghost{background:none;border:1px solid var(--line);color:var(--brand-tx);padding:11px;
border-radius:7px;font-size:14px;font-family:inherit;cursor:pointer;width:100%;margin-top:10px;font-weight:500}
.pgbtn{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:6px;
padding:6px 10px;font-size:12px;font-family:inherit;cursor:pointer;margin:6px 0 0 8px}
.vwrap{position:absolute;inset:0;background:var(--wash);z-index:40;display:flex;flex-direction:column}
.vbar{background:var(--brand-d);color:var(--on-brand);padding:11px 14px;display:flex;align-items:center;gap:10px;
position:sticky;top:0}
.vbar .vt{flex:1;font-size:13px;font-weight:700;line-height:1.35}
.vbar .vt span{display:block;font-size:11px;font-weight:400;color:#5E3413}
.vbar button{background:rgba(0,0,0,.12);border:none;color:var(--on-brand);font-family:inherit;
font-size:13px;font-weight:700;padding:7px 12px;border-radius:6px;cursor:pointer}
.vbody{flex:1;overflow:auto;padding:12px;text-align:center;-webkit-overflow-scrolling:touch}
.vbody img{width:100%;max-width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
.vnav{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 14px 18px;
background:var(--paper);border-top:1px solid var(--line)}
.vnav button{border:1px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;
font-size:14px;padding:9px 16px;border-radius:7px;cursor:pointer;font-weight:500}
.vnav button:disabled{opacity:.4}
.vnav .pn{font-size:13px;color:var(--mute);min-width:74px}
.vfail{padding:34px 18px;color:var(--mute);font-size:13px;line-height:1.9}
.vfail a{color:var(--brand-tx);font-weight:700}
.note{font-size:11px;color:var(--mute);margin-top:10px;line-height:1.7}
input.t{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-size:16px;font-family:inherit}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px;font-weight:500}
@media print{header,footer,button,.note,.fld{display:none!important}main{padding:0}#app{box-shadow:none}}
</style>
</head>

const MAKERS = [
  { id:'TOTO', name:'TOTO',    note:'ネオレスト 2026.6版' },
  { id:'LIXIL',name:'LIXIL',   note:'未登録', off:true },
  { id:'RINNAI', name:'リンナイ', note:'未登録', off:true },
  { id:'NORITZ', name:'ノーリツ', note:'未登録', off:true }
];
const S = { tab:0, maker:null, grp:null, q:'', goods:[], jobs:[], cust:'', addr:'' };

const byMaker = m => CATALOG.filter(r => r.maker === m);
const groupsOf = m => {
  const o = {};
  byMaker(m).forEach(r => o[r.grp] = (o[r.grp]||0)+1);
  return Object.entries(o).sort((a,b) => b[1]-a[1]);
};
const listOf = () => {
  const q = S.q.trim();
  let rows = CATALOG.filter(r => r.maker===S.maker && r.grp===S.grp);
  if (q) rows = rows.filter(r =>
    r.code.toUpperCase().includes(q.toUpperCase()) || (r.name||'').includes(q));
  return rows;
};
const hl = (t,q) => { if(!q) return esc(t);
  const i = t.toUpperCase().indexOf(q.toUpperCase()); if(i<0) return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length)); };
const inCart = c => S.goods.some(g => g.code === c);

function calc(){
  const jobs = S.jobs.map(c => MENU.find(m => m.code===c));
  const work = jobs.reduce((a,j)=>a+j.price,0);
  const hrs  = jobs.reduce((a,j)=>a+j.hrs,0);
  const matCost = jobs.reduce((a,j)=>a+j.mat,0);
  const goods = S.goods.reduce((a,g)=>a+g.price*CONFIG.sellRate*g.qty,0);
  const goodsCost = S.goods.reduce((a,g)=>a+g.price*CONFIG.buyRate*g.qty,0);
  const sub = goods+work, tax = sub*CONFIG.taxRate;
  const gross = sub-goodsCost-matCost, tied = hrs ? hrs+CONFIG.travelHours : 0;
  return {jobs,work,hrs,goods,goodsCost,matCost,sub,tax,total:sub+tax,gross,
          rate: sub?gross/sub:0, tied, perHour: tied?gross/tied:0};
}

const TABS = ['商品','工賃','見積','内部'];
function chrome(){
  el('tabs').innerHTML = TABS.map((t,i)=>{
    const n = i===0 ? S.goods.length : i===1 ? S.jobs.length : 0;
    return `<button data-i="${i}" aria-selected="${S.tab===i}">${t}${n?`<span class="badge">${n}</span>`:''}</button>`;
  }).join('');
  el('tabs').onclick = e => { const b=e.target.closest('button'); if(!b) return; S.tab=+b.dataset.i; render(); };
}
function bar(){
  const c = calc(), p = [];
  if (S.goods.length) p.push(`商品${S.goods.length}点`);
  if (S.jobs.length)  p.push(`工事${S.jobs.length}件`);
  el('foot').innerHTML =
    `<div class="sum">${p.join('・')||'未選択'}<b class="num">${yen(c.total)}</b></div>`+
    `<button class="go" id="nx" ${c.total?'':'disabled'}>${S.tab>=2?'内部チェック':'見積を見る'}</button>`;
  el('nx').onclick = () => { S.tab = S.tab>=2?3:2; render(); };
}
const V = [];

V[0] = () => {
  if (!S.maker) return makerView();
  if (!S.grp)   return groupView();
  return listView();
};

function makerView(){
  el('main').innerHTML = `
    <h2>メーカーを選ぶ</h2>
    <p class="lead">カタログを取り込んだメーカーが並びます。</p>
    <div class="mgrid">${MAKERS.map(m => {
      const n = byMaker(m.id).length;
      const mark = LOGOS[m.id]
        ? `<img src="${LOGOS[m.id]}" alt="${esc(m.name)}">`
        : `<span class="wm">${esc(m.name)}</span>`;
      return `<button class="mk" data-m="${m.id}" ${m.off?'disabled':''}
        aria-label="${esc(m.name)}　${n?n+'品番':'未登録'}">
        <div class="lg">${mark}</div>
        <div class="ft"><b>${n?n+' 品番':'未登録'}</b><span>${esc(m.note)}</span></div></button>`;
    }).join('')}</div>
    <p class="note">未登録のメーカーは、カタログPDFを取り込むと有効になります。ロゴはソース冒頭の LOGOS に画像を追加すると表示されます。登録がなければメーカー名が代わりに出ます。</p>`;
  el('main').onclick = e => { const b=e.target.closest('.mk'); if(!b||b.disabled) return;
    S.maker=b.dataset.m; S.grp=null; S.q=''; render(); };
  bar();
}

function groupView(){
  const gs = groupsOf(S.maker);
  el('main').innerHTML = `
    <div class="crumb"><button data-b="m">メーカー</button><span>›</span><span>${esc(S.maker)}</span></div>
    <h2>分類を選ぶ</h2>
    <p class="lead">${esc(S.maker)}　${byMaker(S.maker).length}品番</p>
    ${gs.map(([g,n]) => `<button class="tile" data-g="${esc(g)}">
      <div class="t1"><b>${esc(g)}</b></div><div class="cn">${n}品番</div><div class="ar">›</div></button>`).join('')}`;
  el('main').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    if (b.dataset.b === 'm'){ S.maker=null; render(); return; }
    if (b.dataset.g){ S.grp=b.dataset.g; S.q=''; render(); }
  };
  bar();
}

function listView(){
  const rows = listOf();
  el('main').innerHTML = `
    <div class="crumb"><button data-b="m">メーカー</button><span>›</span>
      <button data-b="g">${esc(S.maker)}</button><span>›</span><span>${esc(S.grp)}</span></div>
    <div class="srch">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="text" id="q" value="${esc(S.q)}" placeholder="この分類の中を絞り込む" autocomplete="off">
    </div>
    <div class="cnt">${rows.length}件</div>
    ${rows.map(r => `
      <div class="hit">
        <div class="l">
          <div class="cd">${hl(r.code,S.q)}</div>
          ${r.name?`<div class="nm">${hl(r.name,S.q)}</div>`:''}
          <div class="mt">カタログ p.${r.page}</div>
          <button class="add ${inCart(r.code)?'in':''}" data-a="${esc(r.code)}">
            ${inCart(r.code)?'見積に追加済み':'見積に追加'}</button>
          <button class="pgbtn" data-v="${r.page}">カタログ p.${r.page}</button>
        </div>
        <div class="r"><div class="pv num">${yen(r.price*CONFIG.sellRate)}</div>
          <div class="lp num">定価 ${yen(r.price)}</div></div>
      </div>`).join('') || `<p class="empty">該当する品番がありません。</p>`}
    <p class="note">表示価格は定価に販売掛率 ${Math.round(CONFIG.sellRate*100)}% を掛けた金額です。</p>`;
  const q = el('q');
  q.oninput = e => { S.q=e.target.value; listView();
    const n=el('q'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); };
  el('main').onclick = e => {
    const c = e.target.closest('.crumb button');
    if (c){ if(c.dataset.b==='m'){S.maker=null;S.grp=null;} else S.grp=null; render(); return; }
    const v = e.target.closest('.pgbtn');
    if (v){ openCatalog(S.maker, +v.dataset.v); return; }
    const a = e.target.closest('.add'); if(!a) return;
    const code = a.dataset.a;
    if (inCart(code)) S.goods = S.goods.filter(g=>g.code!==code);
    else S.goods.push({...CATALOG.find(x=>x.code===code), qty:1});
    render();
  };
  bar();
}

V[1] = () => {
  const cats = [...new Set(MENU.map(m=>m.cat))];
  el('main').innerHTML = `<h2>工賃を選ぶ</h2><p class="lead">商品代とは別に、作業料金を加えます。</p>` +
    cats.map(c => `<div class="cat">${c}</div>` + MENU.filter(m=>m.cat===c).map(m=>`
      <div class="line" data-c="${m.code}" aria-selected="${S.jobs.includes(m.code)}">
        <div class="bx">✓</div>
        <div class="n">${m.name}<span class="h">目安 ${m.hrs.toFixed(1)}時間</span></div>
        <div class="p num">${yen(m.price)}</div></div>`).join('')).join('');
  el('main').onclick = e => { const l=e.target.closest('.line'); if(!l) return;
    const c=l.dataset.c;
    S.jobs.includes(c)?S.jobs.splice(S.jobs.indexOf(c),1):S.jobs.push(c); render(); };
  bar();
};

V[2] = () => {
  const c = calc();
  const today = new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'});
  el('main').innerHTML = `
    <div class="fld"><label for="cu">お客様名</label><input class="t" id="cu" value="${esc(S.cust)}" placeholder="山田 太郎"></div>
    <div class="fld"><label for="ad">住所</label><input class="t" id="ad" value="${esc(S.addr)}" placeholder="堺市西区鳳東町"></div>
    <div class="card">
      <div class="dochead"><b>お見積書</b><div>${esc(S.cust)||'お客様'} 様　${esc(S.addr)}<br>${today}　EIMEI</div></div>
      <table class="q">
        ${S.goods.map(g=>`<tr><td>${esc(g.name||g.grp)}<small>${esc(g.maker)} ${esc(g.code)}</small></td>
          <td class="r num">${yen(g.price*CONFIG.sellRate*g.qty)}</td></tr>`).join('')}
        ${c.jobs.map(j=>`<tr><td>${j.name}</td><td class="r num">${yen(j.price)}</td></tr>`).join('')}
        ${c.total?'':'<tr><td colspan="2" class="empty">まだ何も選ばれていません</td></tr>'}
        <tr><td>小計</td><td class="r num">${yen(c.sub)}</td></tr>
        <tr><td>消費税</td><td class="r num">${yen(c.tax)}</td></tr>
        <tr class="tot"><td>お見積金額</td><td class="r num">${yen(c.total)}</td></tr>
      </table>
      <div class="promise"><b>EIMEI のお約束</b>
        この金額から追加請求はいたしません。想定外の状況が出た場合は、必ず一度手を止めてご相談します。作業は毎回、同じ担当者がお伺いします。</div>
    </div>
    ${S.goods.length?`<div class="cat">選んだ商品</div>`+S.goods.map(g=>
      `<div class="line"><div class="n">${esc(g.code)}<span class="h">${esc(g.maker)}　${esc(g.name||g.grp)}</span></div>
       <button class="rm" data-r="${esc(g.code)}">外す</button></div>`).join(''):''}
    <button class="ghost" id="pr">印刷 / PDFで保存</button>
    <p class="note">この画面はそのままお客様にお見せできます。原価と粗利は「内部」タブにのみ表示されます。</p>`;
  el('cu').oninput = e => { S.cust=e.target.value; };
  el('ad').oninput = e => { S.addr=e.target.value; };
  el('pr').onclick = () => window.print();
  el('main').onclick = e => { const r=e.target.closest('.rm'); if(!r) return;
    S.goods=S.goods.filter(g=>g.code!==r.dataset.r); render(); };
  bar();
};

V[3] = () => {
  const c = calc(), ok = c.tied ? c.perHour>=NEED : false;
  el('main').innerHTML = `
    <h2>内部チェック</h2><p class="lead">お客様には見せない画面です。</p>
    <div class="intern">
      <div class="k"><span>売上（税抜）</span><b class="num">${yen(c.sub)}</b></div>
      <div class="k"><span>商品原価（掛率${Math.round(CONFIG.buyRate*100)}%）</span><b class="num">${yen(c.goodsCost)}</b></div>
      <div class="k"><span>部材原価</span><b class="num">${yen(c.matCost)}</b></div>
      <div class="k" style="border-top:1px solid #C6D5E1;margin-top:5px;padding-top:10px">
        <span>粗利額</span><b class="num big">${yen(c.gross)}</b></div>
      <div class="k"><span>粗利率</span><b class="num">${(c.rate*100).toFixed(1)}%</b></div>
      <div class="k"><span>拘束時間（作業＋移動）</span><b class="num">${c.tied.toFixed(1)}h</b></div>
      <div class="k"><span>時間あたり粗利</span><b class="num big">${c.tied?yen(c.perHour)+'/h':'—'}</b></div>
      <div class="verdict ${ok?'y':'n'}">${!c.tied
        ? '工賃が選ばれていないため判定できません。工賃タブで作業を追加してください。'
        : ok ? `基準 ${yen(NEED)}/h に対して ${(c.perHour/NEED).toFixed(1)}倍。受注して問題ありません。`
             : `基準 ${yen(NEED)}/h を ${yen(NEED-c.perHour)}/h 下回ります。工賃か商品構成の見直しを。`}</div>
    </div>
    <button class="ghost" id="rs">新しい見積を始める</button>`;
  el('rs').onclick = () => { Object.assign(S,{tab:0,maker:null,grp:null,q:'',goods:[],jobs:[],cust:'',addr:''}); render(); };
  bar();
};

let VIEW = null;
function openCatalog(maker, page){
  const src = CATALOG_SRC[maker];
  if (!src) return;
  VIEW = { maker, page: Math.min(Math.max(page,1), src.pages) };
  paintViewer();
}
function closeCatalog(){ VIEW = null; const v = el('vw'); if (v) v.remove(); }
function paintViewer(){
  const src = CATALOG_SRC[VIEW.maker], p = VIEW.page;
  const url = src.img.replace('{n}', String(p).padStart(3,'0'));
  let v = el('vw');
  if (!v){ v = document.createElement('div'); v.id = 'vw'; v.className = 'vwrap';
           document.getElementById('app').appendChild(v); }
  v.innerHTML = `
    <div class="vbar">
      <div class="vt">カタログ p.${p}<span>${esc(src.title)}</span></div>
      <button id="vx">閉じる</button>
    </div>
    <div class="vbody" id="vb">
      <img id="vi" src="${url}" alt="カタログ ${p}ページ">
    </div>
    <div class="vnav">
      <button id="vp" ${p<=1?'disabled':''}>前のページ</button>
      <span class="pn num">${p} / ${src.pages}</span>
      <button id="vn" ${p>=src.pages?'disabled':''}>次のページ</button>
    </div>`;
  el('vx').onclick = closeCatalog;
  el('vp').onclick = () => { VIEW.page--; paintViewer(); };
  el('vn').onclick = () => { VIEW.page++; paintViewer(); };
  el('vi').onerror = () => {
    el('vb').innerHTML = `<div class="vfail">
      カタログ画像が見つかりません。<br>
      <code>${esc(url)}</code> を配置してください。<br><br>
      <a href="${esc(src.pdf)}#page=${p}" target="_blank" rel="noopener">PDFの ${p}ページを開く</a>
    </div>`;
  };
  el('vb').scrollTop = 0;
}

function render(){ closeCatalog(); chrome(); V[S.tab](); }
render();
</script>
